name: Deploy Website to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 安全红线：只允许发布 website/ 目录。
      # 绝不回退到仓库根目录 —— 否则 server/、docs/、scripts/ 等源码会作为
      # 静态资源被公开访问（历史事故：deploy.yml 用 `pages deploy .`）。
      - name: Verify publish directory
        run: |
          if [ ! -f website/index.html ]; then
            echo "::error::website/index.html 不存在，拒绝发布"
            exit 1
          fi
          echo "发布目录：website/"

      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website --project-name=loongclan --branch main
