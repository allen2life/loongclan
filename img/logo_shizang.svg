<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="shizang-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E2330"/>
      <stop offset="100%" stop-color="#10121A"/>
    </radialGradient>
    <linearGradient id="shizang-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D79E"/>
      <stop offset="50%" stop-color="#C9A86A"/>
      <stop offset="100%" stop-color="#9C7736"/>
    </linearGradient>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C9A86A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer rounded container -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#shizang-bg)" stroke="url(#shizang-gold)" stroke-width="2"/>
  <rect x="9" y="9" width="110" height="110" rx="20" fill="none" stroke="#C9A86A" stroke-width="0.8" stroke-dasharray="3,3" stroke-opacity="0.5"/>

  <!-- Corner embellishments -->
  <path d="M18 28 L18 18 L28 18" fill="none" stroke="url(#shizang-gold)" stroke-width="1.5"/>
  <path d="M110 28 L110 18 L100 18" fill="none" stroke="url(#shizang-gold)" stroke-width="1.5"/>
  <path d="M18 100 L18 110 L28 110" fill="none" stroke="url(#shizang-gold)" stroke-width="1.5"/>
  <path d="M110 100 L110 110 L100 110" fill="none" stroke="url(#shizang-gold)" stroke-width="1.5"/>

  <!-- Seal circular badge -->
  <circle cx="64" cy="64" r="38" fill="#141722" stroke="url(#shizang-gold)" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Calligraphic character '诗' -->
  <text x="64" y="78" text-anchor="middle" font-family="'Noto Serif SC', 'Kaiti', serif" font-weight="900" font-size="44" fill="url(#shizang-gold)" filter="url(#gold-glow)">诗</text>
</svg>
