<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="wenmai-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A2233"/>
      <stop offset="100%" stop-color="#0E131E"/>
    </radialGradient>
    <linearGradient id="wenmai-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED49A"/>
      <stop offset="50%" stop-color="#C9A86A"/>
      <stop offset="100%" stop-color="#8F6E2E"/>
    </linearGradient>
    <filter id="gold-glow-wm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C9A86A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer rounded container -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#wenmai-bg)" stroke="url(#wenmai-gold)" stroke-width="2"/>
  <rect x="9" y="9" width="110" height="110" rx="20" fill="none" stroke="#C9A86A" stroke-width="0.8" stroke-dasharray="3,3" stroke-opacity="0.5"/>

  <!-- Constellation lineage nodes -->
  <circle cx="36" cy="36" r="3" fill="#C9A86A" opacity="0.6"/>
  <circle cx="92" cy="36" r="3" fill="#C9A86A" opacity="0.6"/>
  <circle cx="36" cy="92" r="3" fill="#C9A86A" opacity="0.6"/>
  <circle cx="92" cy="92" r="3" fill="#C9A86A" opacity="0.6"/>
  <line x1="36" y1="36" x2="92" y2="36" stroke="#C9A86A" stroke-width="0.8" stroke-opacity="0.3"/>
  <line x1="36" y1="92" x2="92" y2="92" stroke="#C9A86A" stroke-width="0.8" stroke-opacity="0.3"/>
  <line x1="36" y1="36" x2="36" y2="92" stroke="#C9A86A" stroke-width="0.8" stroke-opacity="0.3"/>
  <line x1="92" y1="36" x2="92" y2="92" stroke="#C9A86A" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- Diamond inner emblem -->
  <polygon points="64,18 110,64 64,110 18,64" fill="#121724" stroke="url(#wenmai-gold)" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Calligraphic character '脉' -->
  <text x="64" y="78" text-anchor="middle" font-family="'Noto Serif SC', 'Kaiti', serif" font-weight="900" font-size="44" fill="url(#wenmai-gold)" filter="url(#gold-glow-wm)">脉</text>
</svg>
